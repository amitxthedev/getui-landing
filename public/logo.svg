<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#000000"></rect>

  <!-- Glow -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Text -->
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="700" fill="#a855f7" filter="url(#glow)">
    GU
  </text>
</svg>
